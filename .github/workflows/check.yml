name: check
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: bash -n sudo-askpass-reason install.sh uninstall.sh
      - name: ShellCheck
        run: shellcheck -S warning sudo-askpass-reason install.sh uninstall.sh
